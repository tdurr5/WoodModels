<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Shaving Horse — Cut List Viewer</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div id="app">
  <div id="viewport">
    <div id="toolbar">
      <button id="resetBtn">Show all</button>
      <button id="wireBtn">Toggle wireframe</button>
      <button id="measureDistBtn">Measure distance</button>
      <button id="measureAngleBtn">Measure angle</button>
      <button id="clearMeasureBtn">Clear measurements</button>
    </div>
    <div id="measureHint"></div>
    <div id="loading">Loading model…</div>
    <div id="dimCard"><div class="arrow"></div></div>
    <div id="axisLabels"></div>
    <div id="measureLabels"></div>
  </div>
  <div id="sidebar">
    <h1>Shaving Horse — Cut List</h1>
    <div class="sub">Click a part here <b>or click it directly on the model</b> to isolate it. Drag to orbit, scroll to zoom, right-drag to pan.</div>
    <div id="list"></div>
  </div>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module" src="app.js"></script>
</body>
</html>
