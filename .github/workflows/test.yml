name: test

# Once per change: pushes to main, and pull requests (which cover their
# branch's pushes) - not a push run and a PR run for every commit.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# a newer push to the same branch cancels the run it replaces
concurrency:
  group: test-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: viewer-screenshots
          path: test-output/
