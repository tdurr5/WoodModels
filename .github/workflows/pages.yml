# Publishes viewer/ to GitHub Pages so it can be opened on a phone or tablet
# (and then used offline). Manual only: run it from the Actions tab after
# enabling Pages with "GitHub Actions" as the source in the repo settings.
name: publish viewer

on:
  workflow_dispatch:
  # also run by update lumber prices (prices.yml) after it commits new prices
  workflow_call:
    inputs:
      ref:
        description: branch or commit to publish
        type: string
        default: ''

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: viewer
      - id: deploy
        uses: actions/deploy-pages@v4
